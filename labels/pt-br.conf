# pt-br overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through pt-br, then pt, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 28 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.authentication_required = Autenticação necessária
errors.push_notifications_not_available = Notificações push indisponíveis
errors.feed_name_is_too_long = O nome do feed é muito longo
errors.feed_name_is_required = O nome do feed é obrigatório
errors.could_not_delete = Não foi possível excluir
errors.push_subscription_missing = Seu navegador não forneceu uma assinatura push
notifications.account.email = E-mail
notifications.account.url = URL externa
errors.invalid_subscription = Assinatura push inválida
errors.registration_failed = Falha no registro push
errors.value_too_long = Valor muito longo (máximo de {maximum} caracteres)
