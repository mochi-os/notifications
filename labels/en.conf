[labels]
app.name = Notifications

# Error messages used by a.error.label(...). Generated keys mirror
# the previous hardcoded a.error() literals.
errors.invalid_id = Invalid id
errors.authentication_required = Authentication required
errors.feed_name_is_too_long = Feed name is too long
errors.feed_name_is_required = Feed name is required
errors.failed_to_create_token = Failed to create token
errors.feed_not_found = Feed not found
errors.not_found = Not found
errors.reassign_to_is_required = reassign_to is required

# Notification self-test title (sent to the user via every category destination).
notifications.body.test = Test notification

# Notification self-test body — names the destination that received it.
notifications.body.test_category = Category: {name}
notifications.body.test_via_account = Sent via {account}

# Fallback names for connected accounts in test bodies when no label is set.
notifications.account.fcm = Android device
notifications.account.unifiedpush = Mobile device
notifications.account.email = Email
notifications.account.browser = Browser push
notifications.account.pushbullet = Pushbullet
notifications.account.ntfy = ntfy
notifications.account.url = External URL

# Server upgrade notifications (added by update_manager work)
notifications.app.server = Mochi server
errors.invalid_subscription = Invalid push subscription
errors.registration_failed = Push registration failed
errors.inbound_not_implemented = Inbound push endpoint not yet implemented

# RSS channel description shown by feed readers.
rss.description = Notifications from Mochi

# Read-time display names for the two seeded categories, applied while their
# stored labels remain the unrenamed English literals.
category.none = No notifications
category.normal = Normal
