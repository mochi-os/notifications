# es-419 overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through es-419, then es, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 33 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.type_is_required = se requiere tipo
errors.push_notifications_not_available = Notificaciones push no disponibles
errors.label_is_required = se requiere etiqueta
errors.push_subscription_missing = Tu navegador no proporcionó una suscripción push
notifications.body.test_category = Categoría: {name}
notifications.body.test_via_account = Enviado vía {account}
